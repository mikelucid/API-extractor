name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Build & deploy to dev EC2
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rootagentv2-web
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}
            docker stop rootagentv2-web || true
            docker rm rootagentv2-web || true
            docker run -d --name rootagentv2-web -p 3000:3000 \
              --env-file /opt/rootagentv2/.env \
              ${{ env.IMAGE }}

      - name: Smoke test
        run: |
          sleep 10
          curl --fail http://${{ secrets.DEV_EC2_HOST }}:3000/ || exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "## Dev Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "- Host: ${{ secrets.DEV_EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
